server:
  port: 8080
  servlet:
    context-path: /hyra_ai

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://localhost:3306/hyra_ai?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

brevo:
  api:
    key: ${BREVO_API_KEY:}
  sender:
    email: ${BREVO_EMAIL:}

facefusion:
  base-url: http://172.16.1.75:8000

xtts:
  base-url: http://172.16.1.75:8020

whisperx:
  api:
    url: http://172.16.0.200:8000

jwt:
  signerKey: "/nvphzRqEgduNfnKy2ztU3XBeojbmK8jzDivxOxLIGnl+D5GfkjyXdLq15xz9af/\n"
  valid-duration: 7200
  refreshable-duration: 360000

app:
  frontend:
    base-url: "http://localhost:5173"

logging:
  level:
    root: INFO
    com.hyra_ai.backend: INFO
    # Giảm stack trace Netty (Connection reset) in ra console khi poll FaceFusion.
    reactor.netty.http.client: WARN
    reactor.netty.channel: WARN
    io.netty.channel: WARN
