server:
  port: 8080
  servlet:
    context-path: /hyra_ai

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: "jdbc:mysql://YOUR_DB_HOST:3306/YOUR_DB_NAME?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    driverClassName: com.mysql.cj.jdbc.Driver
    username: "YOUR_DB_USERNAME"
    password: "YOUR_DB_PASSWORD"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

brevo:
  api:
    key: "YOUR_BREVO_API_KEY"
  sender:
    email: "YOUR_BREVO_SENDER_EMAIL"

facefusion:
  base-url: http://172.16.1.75:8000

xtts:
  base-url: http://172.16.1.75:8020

whisperx:
  api:
    url: http://172.16.0.200:8000

ffmpeg:
  api:
    url: http://172.16.0.207:8000

jwt:
  signerKey: "YOUR_JWT_SECRET_KEY"
  valid-duration: 7200
  refreshable-duration: 360000

app:
  frontend:
    base-url: "http://localhost:5173"

logging:
  level:
    root: INFO
    com.hyra_ai.backend: INFO
    # Giảm stack trace Netty (Connection reset) in ra console khi poll FaceFusion.
    reactor.netty.http.client: WARN
    reactor.netty.channel: WARN
    io.netty.channel: WARN

github:
client-id: "YOUR_GITHUB_CLIENT_ID"
client-secret: "YOUR_GITHUB_CLIENT_SECRET"

cloudflare:
  r2:
    access-key: "YOUR_CLOUDFLARE_R2_ACCESS_KEY"
    secret-key: "YOUR_CLOUDFLARE_R2_SECRET_KEY"
    endpoint: "YOUR_CLOUDFLARE_R2_ENDPOINT"
    bucket: "YOUR_CLOUDFLARE_R2_BUCKET"
    public-url: "YOUR_CLOUDFLARE_R2_PUBLIC_URL"
